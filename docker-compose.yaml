services:
  postgres_db:
    image: postgres:15-alpine
    container_name: rfq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: rfq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - rfq-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rfq_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres123@postgres_db:5432/rfq_db
    depends_on:
      - postgres_db
    networks:
      - rfq-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rfq_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rfq-network

volumes:
  pgdata:

networks:
  rfq-network:
    driver: bridge
